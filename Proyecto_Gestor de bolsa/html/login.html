<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Bolsa de Empleos ULEAM</title>
  <link rel="stylesheet" href="../css/style_global.css">
</head>
<body>

  <!-- HEADER: solo logo, sin nav -->
  <header class="site-header">
    <div class="logo">
      <img src="../img/LOGO-ULEAM-HORIZONTAL.png" alt="ULEAM" style="width:150px;">
    </div>
  </header>

 <main class="main-content">
  <div style="width:100%; max-width:420px;">

    <div class="card">
      <h1 class="card-title">Bienvenido a la Bolsa de Empleos de la ULEAM</h1>

      <p class="login-seccion-label">Acceso manual</p>

      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" placeholder="nombre@uleam.edu.ec">
        <span class="error-msg">Ingresa un correo válido.</span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••••••">
        <span class="error-msg">La contraseña no puede estar vacía.</span>
      </div>

      <button class="btn btn-primary" style="width:100%; justify-content:center; margin-bottom:1.25rem;"
              onclick="validarLogin()">
        Iniciar sesión
      </button>

      <div class="login-divisor"><span>O inicia sesión con</span></div>

      <div class="login-sociales">
        <a href="tipo_usuario.html" class="btn-social">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
        </a>
        <a href="tipo_usuario.html" class="btn-social">
          <svg width="20" height="20" viewBox="0 0 21 21">
            <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
            <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
            <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
            <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
          </svg>
        </a>
      </div>

      <p class="login-registro">
        ¿No tienes cuenta? <a href="tipo_usuario.html">Regístrate</a>
      </p>
    </div>

    <p class="ayuda mt-2">
      ¿Necesitas ayuda? <a href="#">Contactar a soporte</a>
    </p>

  </div>
</main>

  <footer class="site-footer">
    <span>© 2026 ULEAM · Universidad Laica Eloy Alfaro de Manabí</span>
    <div class="footer-links">
      <a href="#">Privacidad</a>
      <a href="#">Términos de uso</a>
    </div>
  </footer>

  <script src="../js/validaciones.js"></script>
</body>
</html>
